# ============================================================
#  build-apk.yml — Workflow de compilación de Beyond Words
#  Compila el APK en GitHub Actions cuando haces push a main
#  o cuando lo lanzas manualmente desde la pestaña Actions.
# ============================================================

name: Build Beyond Words APK

# Cuándo se dispara:
#  - workflow_dispatch: manualmente desde GitHub → Actions → Run workflow
#  - push a main: cada vez que subes un cambio a la rama principal
on:
  workflow_dispatch:
  push:
    branches: [main]

# Permisos mínimos necesarios (solo leer el repo)
permissions:
  contents: read

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    # Todos los comandos se ejecutan dentro de la subcarpeta Guante-De-Voz-App,
    # que es donde está pubspec.yaml y lib/main.dart.
    defaults:
      run:
        working-directory: Guante-De-Voz-App

    steps:
      # ---------------------------------------------------------
      # 1) Descarga el repositorio completo en el runner
      # ---------------------------------------------------------
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2) Instala Java 17 (requerido por Gradle/Android)
      # ---------------------------------------------------------
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3) Instala Flutter stable con caché
      # ---------------------------------------------------------
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # 4) Verifica que el proyecto tenga la estructura correcta
      # ---------------------------------------------------------
      - name: Verificar estructura
        run: |
          pwd
          ls -la
          test -f pubspec.yaml
          test -f lib/main.dart
          ls -la lib/

      # ---------------------------------------------------------
      # 5) Muestra versiones de Flutter y Dart (para diagnóstico)
      # ---------------------------------------------------------
      - name: Verificar Flutter
        run: |
          flutter --version
          dart --version

      # ---------------------------------------------------------
      # 6) Descarga las dependencias declaradas en pubspec.yaml
      #    (incluye file_picker, path_provider, http, etc.)
      # ---------------------------------------------------------
      - name: Instalar dependencias
        run: flutter pub get

      # ---------------------------------------------------------
      # 7) Genera la carpeta android/ desde cero (para evitar
      #    conflictos con builds previos) y la copia al proyecto.
      # ---------------------------------------------------------
      - name: Generar plataforma Android sin sobrescribir
        run: |
          rm -rf /tmp/bw_android
          flutter create \
            --platforms=android \
            --org com.beyondword \
            --project-name beyond_words \
            /tmp/bw_android
          rm -rf android
          cp -R /tmp/bw_android/android ./android

      # ---------------------------------------------------------
      # 8) Fuerza compileSdk 36 / targetSdk 34 / minSdk 23 en el
      #    build.gradle.kts del módulo app.
      #    Necesario porque file_picker depende de
      #    flutter_plugin_android_lifecycle que exige compileSdk 36.
      # ---------------------------------------------------------
      - name: Configurar compileSdk 36, targetSdk 34 y minSdk 23
        run: |
          GRADLE_FILE=$(find android/app -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          echo "Gradle file encontrado: $GRADLE_FILE"
          if [[ "$GRADLE_FILE" == *.kts ]]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE_FILE" || true
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' "$GRADLE_FILE" || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' "$GRADLE_FILE" || true
            sed -i 's/targetSdk = [0-9]*/targetSdk = 34/' "$GRADLE_FILE" || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$GRADLE_FILE" || true
            sed -i 's/minSdk = [0-9]*/minSdk = 23/' "$GRADLE_FILE" || true
          else
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$GRADLE_FILE" || true
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' "$GRADLE_FILE" || true
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' "$GRADLE_FILE" || true
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/' "$GRADLE_FILE" || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$GRADLE_FILE" || true
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' "$GRADLE_FILE" || true
          fi
          echo "=== Contenido del archivo Gradle ==="
          cat "$GRADLE_FILE"

      # ---------------------------------------------------------
      # 9) También fuerza compileSdk 36 en el build.gradle raíz
      #    (algunos plugins leen de aquí).
      # ---------------------------------------------------------
      - name: Configurar compileSdk en build.gradle raíz
        run: |
          if [ -f android/build.gradle ]; then
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' android/build.gradle || true
            cat android/build.gradle
          fi
          if [ -f android/build.gradle.kts ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' android/build.gradle.kts || true
            cat android/build.gradle.kts
          fi

      # ---------------------------------------------------------
      # 10) Fuerza compileSdk 36 y minSdk 23 en gradle.properties.
      #     Este archivo NO lo sobreescribe Flutter durante el
      #     build, así que los valores persisten.
      # ---------------------------------------------------------
      - name: Forzar compileSdk 36 en gradle.properties
        run: |
          cat >> android/gradle.properties <<'EOF'

          android.compileSdkVersion=36
          android.targetSdkVersion=34
          android.minSdkVersion=23
          EOF
          cat android/gradle.properties

      # ---------------------------------------------------------
      # 11) Crea un init script de Gradle en ~/.gradle/init.d/
      #     Gradle lo carga automáticamente al arrancar y aplica
      #     compileSdkVersion 36 a TODOS los subproyectos,
      #     incluyendo plugins como file_picker.
      #     Es más robusto que el sed (Flutter no lo sobreescribe).
      # ---------------------------------------------------------
      - name: Crear init script de Gradle en HOME
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-compile-sdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          cat ~/.gradle/init.d/force-compile-sdk.gradle

            # ---------------------------------------------------------
      # 12) Escribe el AndroidManifest.xml con permisos BLE,
      #     ACCESS_NETWORK_STATE (para ML Kit) y las librerías
      #     nativas necesarias para MediaPipe/Gemma.
      # ---------------------------------------------------------
      - name: Escribir AndroidManifest con permisos BLE y ML Kit
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Permisos BLE Android 12+ -->
              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <!-- Permisos BLE Android 11 e inferiores -->
              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />
              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />

              <!-- Permiso para que ML Kit descargue modelos -->
              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="true" />

              <application
                  android:label="Beyond Words"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF
          cat android/app/src/main/AndroidManifest.xml

      # ---------------------------------------------------------
      # 13) Restaura dependencias por si el paso 7 las borró.
      # ---------------------------------------------------------
      - name: Restaurar dependencias
        run: flutter pub get

      # ---------------------------------------------------------
      # 14) Analiza el código. `|| true` evita que un warning
      #     detenga la compilación.
      # ---------------------------------------------------------
      - name: Analizar
        run: flutter analyze || true

      # ---------------------------------------------------------
      # 15) Compila el APK de release.
      #     --no-tree-shake-icons evita problemas con íconos
      #     dinámicos en build release.
      # ---------------------------------------------------------
      - name: Compilar APK release
        run: flutter build apk --release --no-tree-shake-icons

      # ---------------------------------------------------------
      # 16) Verifica que el APK exista antes de subirlo.
      # ---------------------------------------------------------
      - name: Verificar APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      # ---------------------------------------------------------
      # 17) Sube el APK como artifact descargable.
      # ---------------------------------------------------------
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Beyond-Words-APK
          path: Guante-De-Voz-App/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
